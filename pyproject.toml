[project]
name = "glowfield"
version = "0.1.0"
description = "Glowfield: a no-guess reverse minesweeper with fireflies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Remco Brink", email = "nilicule@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
glowfield = "glowfield:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
